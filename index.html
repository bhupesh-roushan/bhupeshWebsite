<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />

    <title>Bhupesh Roushan — Full Stack Developer</title>
    <meta
      name="description"
      content="Full-stack developer building web platforms and AI-assisted workflows. Curriculum Engineer at Masai. React, Node.js, TypeScript, MongoDB and GenAI. Based in Bangalore, India."
    />
    <meta name="author" content="Bhupesh Roushan" />
    <link rel="canonical" href="https://www.bhupesh.blog/" />

    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark light" />

    <!-- Runs before the stylesheet, so the page paints in the right theme the
         first time instead of flashing dark and switching. Dark is the default:
         it is the look the site was designed in, and a visitor who prefers the
         light one makes that choice once and it is remembered. -->
    <script>
      (function () {
        var t = "dark";
        try {
          if (localStorage.getItem("theme") === "light") t = "light";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", t);
        if (t === "light") {
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", "#f6f7fb");
        }
      })();
    </script>

    <!-- Link previews: without these, sharing the URL on LinkedIn, WhatsApp or
         Slack renders a bare link with no title, blurb or image. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.bhupesh.blog/" />
    <meta property="og:title" content="Bhupesh Roushan — Full Stack Developer" />
    <meta
      property="og:description"
      content="Full-stack developer building web platforms and AI-assisted workflows. React, Node.js, TypeScript and GenAI."
    />
    <meta property="og:image" content="https://www.bhupesh.blog/og/home.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="bhupesh.blog" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@roushanwa" />
    <meta name="twitter:title" content="Bhupesh Roushan — Full Stack Developer" />
    <meta
      name="twitter:description"
      content="Full-stack developer building web platforms and AI-assisted workflows."
    />
    <meta name="twitter:image" content="https://www.bhupesh.blog/og/home.png" />

    <!-- Structured data (Person, WebSite, ProfilePage) is not written here. It is
         generated from src/data by scripts/structured-data.mjs and injected by the
         prerender step, so jobTitle, sameAs and knowsAbout can't drift from what
         the page shows. Anything placed in a ld+json script in this file is
         removed at build time. -->
    <!-- Same-origin and preloaded: the browser can start fetching these
         before the stylesheet that references them has even parsed. -->
    <link rel="preload" href="/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

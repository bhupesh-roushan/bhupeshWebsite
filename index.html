<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />

    <title>Bhupesh Roushan — Full Stack Developer</title>
    <meta
      name="description"
      content="Full-stack developer building web platforms and AI-assisted workflows. Curriculum Engineer at Masai. React, Node.js, TypeScript, MongoDB and GenAI. Based in Bangalore, India."
    />
    <meta name="author" content="Bhupesh Roushan" />
    <link rel="canonical" href="https://www.bhupesh.blog/" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Link previews: without these, sharing the URL on LinkedIn, WhatsApp or
         Slack renders a bare link with no title, blurb or image. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.bhupesh.blog/" />
    <meta property="og:title" content="Bhupesh Roushan — Full Stack Developer" />
    <meta
      property="og:description"
      content="Full-stack developer building web platforms and AI-assisted workflows. React, Node.js, TypeScript and GenAI."
    />
    <meta property="og:image" content="https://www.bhupesh.blog/og/home.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="bhupesh.blog" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@roushanwa" />
    <meta name="twitter:title" content="Bhupesh Roushan — Full Stack Developer" />
    <meta
      name="twitter:description"
      content="Full-stack developer building web platforms and AI-assisted workflows."
    />
    <meta name="twitter:image" content="https://www.bhupesh.blog/og/home.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Lets Google render a person rich result rather than a plain blue link -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Bhupesh Roushan",
        "url": "https://www.bhupesh.blog/",
        "image": "https://www.bhupesh.blog/og-image.png",
        "jobTitle": "Curriculum Engineer",
        "worksFor": { "@type": "Organization", "name": "Masai" },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Bangalore",
          "addressCountry": "IN"
        },
        "email": "mailto:roushan.bhupesh@gmail.com",
        "sameAs": [
          "https://github.com/bhupesh-roushan",
          "https://www.linkedin.com/in/roushanb",
          "https://x.com/roushanwa",
          "https://www.instagram.com/roushanwa"
        ],
        "knowsAbout": [
          "Full Stack Development",
          "React",
          "Node.js",
          "TypeScript",
          "MongoDB",
          "Generative AI",
          "Prompt Engineering"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
